<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fiches de révision — Ferroviaire</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold text-decoration-none" href="index.html"
          >Quiz ferroviaire</a
        >
        <div class="d-flex align-items-center gap-2">
          <span class="text-white-50 small d-none d-sm-inline"
            >Fiches express</span
          ><button
            id="themeToggle"
            class="btn btn-sm btn-outline-light"
            type="button"
          >
            🌙
          </button>
        </div>
      </div>
    </nav>
    <main class="container py-4 course-page">
      <div
        class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"
      >
        <div>
          <h1 class="h3 mb-1">⚡ Fiches de révision</h1>
          <p class="text-secondary mb-0">
            Des fiches courtes, séparées des cours détaillés.
          </p>
        </div>
        <a class="btn btn-outline-secondary" href="index.html"
          >← Retour au quiz</a
        >
      </div>
      <div id="sheetHome"></div>
      <div id="sheetDetail" class="d-none"></div>
    </main>
    <script src="course.js"></script>
    <script>
      function esc(v) {
        return String(v).replace(
          /[&<>'"]/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[m],
        );
      }
      const home = document.getElementById("sheetHome"),
        detail = document.getElementById("sheetDetail");
      function renderHome() {
        home.innerHTML = `<div class="row g-3">${REVISION_SHEETS.map((s) => `<div class="col-12 col-md-6"><div class="revision-sheet h-100"><div class="d-flex align-items-center gap-2"><span class="course-icon small">${s.icon}</span><div><h2 class="h5 mb-0">${esc(s.title)}</h2><p class="text-secondary small mb-0 mt-1">${s.points.length} points essentiels</p></div></div><button class="btn btn-outline-primary mt-3" onclick="openSheet('${s.id}')">Ouvrir la fiche →</button></div></div>`).join("")}</div>`;
      }
      function openSheet(id) {
        const s = REVISION_SHEETS.find((x) => x.id === id);
        if (!s) return;
        history.replaceState(
          {},
          "",
          `fiches.html?fiche=${encodeURIComponent(id)}`,
        );
        home.classList.add("d-none");
        detail.classList.remove("d-none");
        detail.innerHTML = `<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><div><h2 class="h3 mb-1">${s.icon} ${esc(s.title)}</h2><p class="text-secondary mb-0">Les points à revoir rapidement avant un quiz ou un cours.</p></div><button class="btn btn-outline-secondary" onclick="showHome()">← Toutes les fiches</button></div><div class="revision-reading card border"><div class="card-body p-4"><ul class="revision-big-list mb-0">${s.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div></div>`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function showHome() {
        history.replaceState({}, "", "fiches.html");
        detail.classList.add("d-none");
        home.classList.remove("d-none");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      const params = new URLSearchParams(location.search);
      const id = params.get("fiche");
      if (id && REVISION_SHEETS.some((s) => s.id === id)) openSheet(id);
      else renderHome();
      function applyTheme() {
        const dark = localStorage.getItem("quizDarkMode") === "1";
        document.documentElement.setAttribute(
          "data-bs-theme",
          dark ? "dark" : "light",
        );
        const b = document.getElementById("themeToggle");
        if (b) b.textContent = dark ? "☀️" : "🌙";
      }
      document.getElementById("themeToggle").onclick = () => {
        const dark = localStorage.getItem("quizDarkMode") === "1";
        localStorage.setItem("quizDarkMode", dark ? "0" : "1");
        applyTheme();
      };
      applyTheme();
    </script>
  </body>
</html>
