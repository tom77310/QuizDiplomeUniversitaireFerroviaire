<!doctype html>
<html lang="fr">
  <head>
    <!-- =========================================================
         CONFIGURATION DE LA PAGE
         ========================================================= -->

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Fiches de révision — Ferroviaire</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Styles personnalisés -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================================================
         BARRE DE NAVIGATION
         ========================================================= -->

    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <!-- Nom du site -->
        <a
          class="navbar-brand fw-bold text-decoration-none"
          href="index.html"
        >
          Quiz ferroviaire
        </a>

        <div class="d-flex align-items-center gap-2">
          <!-- Indication de la page actuelle -->
          <span class="text-white-50 small d-none d-sm-inline">
            Fiches express
          </span>

          <!-- Bouton de changement de thème -->
          <button
            id="themeToggle"
            class="btn btn-sm btn-outline-light"
            type="button"
          >
            🌙
          </button>
        </div>
      </div>
    </nav>

    <!-- =========================================================
         CONTENU PRINCIPAL
         ========================================================= -->

    <main class="container py-4 course-page">
      <!-- En-tête de la page -->
      <div
        class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"
      >
        <div>
          <h1 class="h3 mb-1">⚡ Fiches de révision</h1>

          <p class="text-secondary mb-0">
            Des fiches courtes, séparées des cours détaillés.
          </p>
        </div>

        <!-- Retour à la page principale du quiz -->
        <a class="btn btn-outline-secondary" href="index.html">
          ← Retour au quiz
        </a>
      </div>

      <!-- =======================================================
           LISTE DES FICHES
           ======================================================= -->

      <!-- Cette zone contient toutes les fiches disponibles -->
      <div id="sheetHome"></div>

      <!-- =======================================================
           DÉTAIL DE LA FICHE SÉLECTIONNÉE
           ======================================================= -->

      <!-- Cette zone affiche la fiche ouverte -->
      <div id="sheetDetail" class="d-none"></div>
    </main>

    <!-- =========================================================
         DONNÉES DES COURS ET FICHES
         ========================================================= -->

    <script src="course.js"></script>

    <!-- =========================================================
         LOGIQUE DE LA PAGE DES FICHES
         ========================================================= -->

    <script>
      /* ---------------------------------------------------------
         ÉCHAPPEMENT DU HTML
         ---------------------------------------------------------
         Évite qu'un texte provenant des données puisse être
         interprété directement comme du HTML.
         --------------------------------------------------------- */

      function esc(v) {
        return String(v).replace(
          /[&<>'"]/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[m],
        );
      }

      /* ---------------------------------------------------------
         RÉCUPÉRATION DES ÉLÉMENTS HTML
         --------------------------------------------------------- */

      const home = document.getElementById("sheetHome");
      const detail = document.getElementById("sheetDetail");

      /* =========================================================
         AFFICHAGE DE LA LISTE DES FICHES
         ========================================================= */

      function renderHome() {
        home.innerHTML = `
          <div class="row g-3">
            ${REVISION_SHEETS.map(
              (s) => `
                <div class="col-12 col-md-6">
                  <div class="revision-sheet h-100">

                    <div class="d-flex align-items-center gap-2">
                      <!-- Icône de la fiche -->
                      <span class="course-icon small">
                        ${s.icon}
                      </span>

                      <!-- Titre et nombre de points -->
                      <div>
                        <h2 class="h5 mb-0">
                          ${esc(s.title)}
                        </h2>

                        <p class="text-secondary small mb-0 mt-1">
                          ${s.points.length} points essentiels
                        </p>
                      </div>
                    </div>

                    <!-- Ouverture de la fiche -->
                    <button
                      class="btn btn-outline-primary mt-3"
                      onclick="openSheet('${s.id}')"
                    >
                      Ouvrir la fiche →
                    </button>

                  </div>
                </div>
              `,
            ).join("")}
          </div>
        `;
      }

      /* =========================================================
         OUVERTURE D'UNE FICHE
         ========================================================= */

      function openSheet(id) {
        // Recherche la fiche correspondant à l'identifiant.
        const s = REVISION_SHEETS.find((x) => x.id === id);

        // Si la fiche n'existe pas, on arrête la fonction.
        if (!s) return;

        /* Met à jour l'URL afin de pouvoir accéder directement
           à la fiche sélectionnée. */
        history.replaceState(
          {},
          "",
          `fiches.html?fiche=${encodeURIComponent(id)}`,
        );

        // Masque la liste des fiches.
        home.classList.add("d-none");

        // Affiche le détail de la fiche.
        detail.classList.remove("d-none");

        /* -------------------------------------------------------
           CONSTRUCTION DU CONTENU DE LA FICHE
           ------------------------------------------------------- */

        detail.innerHTML = `
          <!-- En-tête de la fiche -->
          <div
            class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"
          >
            <div>
              <h2 class="h3 mb-1">
                ${s.icon} ${esc(s.title)}
              </h2>

              <p class="text-secondary mb-0">
                Les points à revoir rapidement avant un quiz ou un cours.
              </p>
            </div>

            <!-- Retour à la liste des fiches -->
            <button
              class="btn btn-outline-secondary"
              onclick="showHome()"
            >
              ← Toutes les fiches
            </button>
          </div>

          <!-- Contenu de la fiche -->
          <div class="revision-reading card border">
            <div class="card-body p-4">

              <ul class="revision-big-list mb-0">
                ${s.points
                  .map(
                    (p) => `
                      <li>
                        ${esc(p)}
                      </li>
                    `,
                  )
                  .join("")}
              </ul>

            </div>
          </div>
        `;

        // Retour en haut de page lors de l'ouverture.
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      /* =========================================================
         RETOUR À LA LISTE DES FICHES
         ========================================================= */

      function showHome() {
        // Réinitialise l'URL.
        history.replaceState({}, "", "fiches.html");

        // Masque la fiche actuellement ouverte.
        detail.classList.add("d-none");

        // Réaffiche la liste des fiches.
        home.classList.remove("d-none");

        // Retour en haut de page.
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      /* =========================================================
         OUVERTURE DIRECTE D'UNE FICHE VIA L'URL
         ========================================================= */

      const params = new URLSearchParams(location.search);
      const id = params.get("fiche");

      if (id && REVISION_SHEETS.some((s) => s.id === id)) {
        // Une fiche valide est indiquée dans l'URL.
        openSheet(id);
      } else {
        // Aucune fiche valide : affichage de la liste.
        renderHome();
      }

      /* =========================================================
         GESTION DU MODE CLAIR / SOMBRE
         ========================================================= */

      function applyTheme() {
        // Récupère l'état du mode sombre enregistré.
        const dark = localStorage.getItem("quizDarkMode") === "1";

        // Applique le thème Bootstrap.
        document.documentElement.setAttribute(
          "data-bs-theme",
          dark ? "dark" : "light",
        );

        // Met à jour l'icône du bouton.
        const b = document.getElementById("themeToggle");

        if (b) {
          b.textContent = dark ? "☀️" : "🌙";
        }
      }

      /* ---------------------------------------------------------
         BOUTON DE CHANGEMENT DE THÈME
         --------------------------------------------------------- */

      document.getElementById("themeToggle").onclick = () => {
        const dark = localStorage.getItem("quizDarkMode") === "1";

        // Inverse le mode actuel.
        localStorage.setItem("quizDarkMode", dark ? "0" : "1");

        // Applique immédiatement le nouveau thème.
        applyTheme();
      };

      /* ---------------------------------------------------------
         APPLICATION INITIALE DU THÈME
         --------------------------------------------------------- */

      applyTheme();
    </script>
  </body>
</html>
