<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cours ferroviaire — Révisions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold text-decoration-none" href="index.html"
          >Quiz ferroviaire</a
        ><span class="text-white-50 small">Cours du DU ferroviaire</span>
      </div>
    </nav>
    <main class="container py-4 course-page">
      <div
        class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"
      >
        <div>
          <h1 class="h3 mb-1">📚 Cours</h1>
          <p class="text-secondary mb-0">
            Choisis un thème. Un seul cours est affiché à la fois pour garder la
            page lisible.
          </p>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-warning" href="fiches.html"
            >⚡ Fiches express</a
          ><a class="btn btn-outline-secondary" href="index.html"
            >← Retour au quiz</a
          >
        </div>
      </div>
      <div id="courseHome"></div>
      <div id="courseDetail" class="d-none"></div>
    </main>
    <script src="course.js"></script>
    <script>
      function escapeHtmlLocal(v) {
        return String(v).replace(
          /[&<>'"]/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[m],
        );
      }
      const home = document.getElementById("courseHome"),
        detail = document.getElementById("courseDetail");
      function renderHome() {
        home.innerHTML = `<div class="row g-3">${COURSE.map((c) => `<div class="col-12 col-md-6"><div class="card h-100 course-card"><div class="card-body"><div class="d-flex gap-3"><div class="course-icon">${c.icon}</div><div><h2 class="h5 mb-1">${escapeHtmlLocal(c.title)}</h2><p class="text-secondary small">${escapeHtmlLocal(c.subtitle)}</p></div></div><button class="btn btn-primary mt-3" onclick="openCourse('${c.id}')">Ouvrir le cours →</button></div></div></div>`).join("")}</div>`;
      }
      function openCourse(id) {
        const c = COURSE.find((x) => x.id === id);
        if (!c) return;
        history.replaceState(
          {},
          "",
          `cours.html?theme=${encodeURIComponent(id)}`,
        );
        home.classList.add("d-none");
        detail.classList.remove("d-none");
        detail.innerHTML = `<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><div><h2 class="h3 mb-1">${c.icon} ${escapeHtmlLocal(c.title)}</h2><p class="text-secondary mb-0">${escapeHtmlLocal(c.subtitle)}</p></div><button class="btn btn-outline-secondary" onclick="showCourseHome()">← Tous les cours</button></div><div class="course-reading">${c.sections.map((s, i) => `<section class="course-section card border mb-3"><div class="card-body"><h3 class="h5">${i + 1}. ${escapeHtmlLocal(s.title.replace(/^\\d+\\.\\s*/, ""))}</h3><ul>${s.bullets.map((b) => `<li>${escapeHtmlLocal(b)}</li>`).join("")}</ul><div class="course-key"><strong>🎯 À retenir :</strong> ${escapeHtmlLocal(s.key)}</div></div></section>`).join("")}</div>`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function showCourseHome() {
        history.replaceState({}, "", "cours.html");
        detail.classList.add("d-none");
        home.classList.remove("d-none");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme");
      if (theme && COURSE.some((c) => c.id === theme)) openCourse(theme);
      else renderHome();
    </script>
  </body>
</html>
